name: tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Pin the OS image instead of `ubuntu-latest`, which is scheduled to
    # move to Ubuntu 26 on 2026-10-19. Pinning keeps CI reproducible.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: [ "3.10", "3.12" ]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Env info
        run: |
          python -V
          python -c "import pandas, numpy; print('pandas', pandas.__version__, 'numpy', numpy.__version__)"
          node --version || echo "node not found"

      # Failures are surfaced as GitHub annotations, so the run summary shows
      # the failing test names without opening the raw log.
      - name: Run tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/tests.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "---- failed tests ----"
            grep -E "^(FAIL|ERROR):" /tmp/tests.log | sort -u | while IFS= read -r line; do
              echo "::error title=${line%% *}::$line"
            done
            echo "---- last 40 lines ----"
            tail -40 /tmp/tests.log
          fi
          exit "$rc"