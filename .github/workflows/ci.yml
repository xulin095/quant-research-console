name: tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [ "3.10", "3.12" ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Only what the tests actually import. akshare / yfinance are used
      # only by the real fetchers, not by the test suite.
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Env info
        run: |
          python -V
          ls -la
          node --version || echo "node not found"

      - name: Run tests
        run: python -m unittest discover -s tests -v